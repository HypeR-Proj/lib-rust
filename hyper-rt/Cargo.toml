[package]
name = "hyper-rt"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HypeR-Proj/lib-rust"
publish = false
description = "Language runtime entry for freestanding HypeR Native Rust applications"
workspace = ".."

[dependencies]

[dependencies.hyper-abi]
workspace = true

[dependencies.hyper-os]
path = "../hyper-os"

[dependencies.hyper-sys]
path = "../hyper-sys"

[features]
std = []

[lints]

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(target_os, values(\"hyper\"))"]
